<div id="env" aria-hidden="true"><canvas id="fx"></canvas><div id="lanterns"></div><div id="floor"></div></div>
<div id="corners" aria-hidden="true"></div>

<div id="splash"><p></p><p></p></div>

<main id="stage">

    <div class="rig b" aria-hidden="true"><i class="bd bd-l"></i><i class="bd bd-r"></i><i class="sk sk-l"></i><i class="sk sk-r"></i><i class="sp"></i></div>

    <div class="rig t" aria-hidden="true"><i class="gt"></i></div>
  </div></div>
  <button id="open" type="button">Abrir o presente</button>
  <p id="hint" class="hand">arraste a página ou use as setas</p>
</main>
<p id="chapter" class="hand" aria-live="polite"></p>
<button id="prev" class="nav" type="button" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button id="next" class="nav" type="button" aria-label="Próxima página"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button id="music" type="button" aria-label="Música: tocar ou pausar" aria-pressed="false">
  <svg viewBox="0 0 24 24" class="ic-play"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
